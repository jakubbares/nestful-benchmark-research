<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NESTFUL Run Explorer</title>
<style>
:root{
  --bg:#0b0e14; --panel:#111621; --panel2:#0e131c; --raised:#171d29;
  --bd:#222b3a; --bd2:#2e3949;
  --tx:#d8dee9; --tx2:#98a3b6; --tx3:#6b7688;
  --acc:#5aa9ff; --ours:#2dd4bf; --base:#f0a04b;
  --ok:#4ec97e; --bad:#f2686a; --warn:#e0b341; --alt:#a78bfa;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
}
html[data-theme="light"]{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#fbfcfd; --raised:#f0f2f5;
  --bd:#dde1e8; --bd2:#c8cfda;
  --tx:#1a1f2a; --tx2:#57616f; --tx3:#8892a0;
  --acc:#0a66c2; --ours:#0d9488; --base:#c2680a;
  --ok:#1a7f42; --bad:#c0392f; --warn:#a37000; --alt:#6d47d9;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 var(--sans);
     -webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}

/* ---------- chrome ---------- */
#app{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:14px;padding:0 14px;height:46px;
       background:var(--panel);border-bottom:1px solid var(--bd);flex:none}
.brand{font-weight:650;letter-spacing:-.2px;white-space:nowrap}
.brand small{color:var(--tx3);font-weight:400;margin-left:7px}
nav{display:flex;gap:2px;margin-left:8px}
nav button{background:none;border:0;padding:6px 11px;border-radius:6px;color:var(--tx2);cursor:pointer}
nav button:hover{background:var(--raised);color:var(--tx)}
nav button.on{background:var(--raised);color:var(--tx);box-shadow:inset 0 0 0 1px var(--bd2)}
.spacer{flex:1}
.iconbtn{background:var(--panel2);border:1px solid var(--bd);border-radius:6px;padding:5px 9px;
         cursor:pointer;color:var(--tx2)}
.iconbtn:hover{border-color:var(--bd2);color:var(--tx)}
main{flex:1;min-height:0;overflow:hidden}
.view{display:none;height:100%}
.view.on{display:block}
.scroll{height:100%;overflow:auto}
.pad{padding:18px 22px;max-width:1180px}

/* ---------- explorer ---------- */
#explorer{display:flex;height:100%}
#side{width:392px;flex:none;border-right:1px solid var(--bd);display:flex;flex-direction:column;background:var(--panel2)}
#side .top{padding:10px;border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:8px}
.searchwrap{position:relative}
.searchwrap input{width:100%;padding:7px 26px 7px 9px;background:var(--bg);border:1px solid var(--bd);
                  border-radius:6px;outline:none}
.searchwrap input:focus{border-color:var(--acc)}
.searchwrap .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);cursor:pointer;
                 color:var(--tx3);background:none;border:0;padding:2px 4px}
.frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.frow label{color:var(--tx3);font-size:11px;text-transform:uppercase;letter-spacing:.5px;flex:none}
select{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 7px;outline:none;max-width:100%}
select:focus{border-color:var(--acc)}
.count{color:var(--tx3);font-size:11.5px;display:flex;justify-content:space-between;align-items:center}
.count b{color:var(--tx);font-weight:600}
#list{flex:1;overflow:auto}
.item{padding:8px 10px;border-bottom:1px solid var(--bd);cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.item:hover{background:var(--raised)}
.item.on{background:var(--raised);box-shadow:inset 3px 0 0 var(--acc)}
.item .idx{color:var(--tx3);font:11px/1.5 var(--mono);flex:none;width:34px;text-align:right;padding-top:1px}
.item .body{flex:1;min-width:0}
.item .q{color:var(--tx);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
         overflow:hidden;font-size:12.2px}
.item .meta{display:flex;gap:5px;align-items:center;margin-top:4px;flex-wrap:wrap}
.dots{display:flex;gap:3px}
.dot{width:9px;height:9px;border-radius:2.5px;background:var(--bd2);flex:none}
.dot.exact{background:var(--ok)} .dot.alt_win{background:var(--alt)}
.dot.args,.dot.order,.dot.partial_funcs,.dot.wrong_funcs,.dot.exec_error{background:var(--bad)}
.dot.refusal{background:var(--warn)} .dot.unparsable{background:var(--tx3)}
#detail{flex:1;min-width:0;overflow:auto}

/* ---------- bits ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:1.5px 6px;border-radius:4px;
     background:var(--raised);color:var(--tx2);border:1px solid var(--bd);white-space:nowrap;font-weight:500}
.tag.math{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 35%,transparent)}
.tag.code{color:var(--alt);border-color:color-mix(in srgb,var(--alt) 35%,transparent)}
.tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.tag.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.tag.alt{color:var(--alt);border-color:color-mix(in srgb,var(--alt) 40%,transparent)}
.tag.ours{color:var(--ours);border-color:color-mix(in srgb,var(--ours) 40%,transparent)}
.tag.base{color:var(--base);border-color:color-mix(in srgb,var(--base) 40%,transparent)}
.mono{font-family:var(--mono)}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:9px;margin-bottom:14px;overflow:hidden}
.card>h3{margin:0;padding:9px 13px;font-size:12px;font-weight:600;letter-spacing:.2px;
         border-bottom:1px solid var(--bd);background:var(--panel2);display:flex;align-items:center;gap:8px}
.card>h3 .spacer{flex:1}
.card .in{padding:13px}
pre{margin:0;font-family:var(--mono);font-size:11.6px;line-height:1.55;white-space:pre-wrap;
    word-break:break-word;overflow-wrap:anywhere}
.codebox{background:var(--panel2);border:1px solid var(--bd);border-radius:7px;padding:10px 12px;
         max-height:340px;overflow:auto}
.codebox.tall{max-height:none}
h2{font-size:16px;margin:0 0 4px}
.sub{color:var(--tx2);margin:0 0 16px;max-width:74ch}
table{border-collapse:collapse;width:100%;font-size:12.2px}
th,td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--bd)}
th{color:var(--tx3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;
   position:sticky;top:0;background:var(--panel);z-index:1}
td.num,th.num{text-align:right;font-family:var(--mono)}
tr.hl td{background:color-mix(in srgb,var(--acc) 9%,transparent)}
.best{color:var(--ok);font-weight:650}
.muted{color:var(--tx3)}
.bar{height:7px;border-radius:4px;background:var(--bd);overflow:hidden;display:flex;min-width:120px}
.bar span{height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--tx2);margin-top:10px}
.legend i{width:9px;height:9px;border-radius:2.5px;display:inline-block;margin-right:5px;vertical-align:-1px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.2px}
.kv dt{color:var(--tx3)} .kv dd{margin:0;font-family:var(--mono);font-size:11.6px}
.note{background:color-mix(in srgb,var(--warn) 9%,transparent);
      border:1px solid color-mix(in srgb,var(--warn) 32%,transparent);
      border-radius:8px;padding:10px 13px;font-size:12.3px;color:var(--tx);margin-bottom:14px}
.note b{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}

/* ---------- call chain ---------- */
.chain{display:flex;flex-direction:column;gap:5px}
.call{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:6px;background:var(--panel2);
      border:1px solid var(--bd);font-family:var(--mono);font-size:11.6px}
.call .n{color:var(--tx3);flex:none;width:16px}
.call .fn{color:var(--acc);font-weight:600}
.call .lbl{color:var(--tx3)}
.call .args{color:var(--tx2);word-break:break-word;overflow-wrap:anywhere}
.call .args em{font-style:normal;color:var(--warn);font-weight:600}
.call.match{border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.call.diffarg{border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.call.diffname{border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.call.miss{border-style:dashed;opacity:.6}
.call .badge{margin-left:auto;flex:none;font-size:10px;padding:1px 5px;border-radius:4px;font-family:var(--sans)}
.call.match .badge{color:var(--ok)} .call.diffarg .badge{color:var(--warn)}
.call.diffname .badge{color:var(--bad)} .call.miss .badge{color:var(--tx3)}
mark{background:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--tx);border-radius:2px;padding:0 1px}

/* ---------- run panels ---------- */
.runhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.runhead .nm{font-weight:650}
.runhead .nm.ours{color:var(--ours)} .runhead .nm.base{color:var(--base)}
.why{color:var(--tx2);font-size:12.3px;margin:0 0 11px;padding-left:9px;
     border-left:2px solid var(--bd2);max-width:82ch}
.ansrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:11px;font-size:12.2px}
.ansrow .box{background:var(--panel2);border:1px solid var(--bd);border-radius:6px;padding:5px 9px;
             font-family:var(--mono);font-size:11.6px}
.ansrow .box.ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok)}
.ansrow .box.bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}
details{margin-top:9px}
summary{cursor:pointer;color:var(--tx2);font-size:11.8px;user-select:none;padding:3px 0}
summary:hover{color:var(--tx)}
details[open] summary{margin-bottom:7px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;z-index:50;padding:34px}
.modal.on{display:flex;align-items:stretch;justify-content:center}
.modal .win{background:var(--panel);border:1px solid var(--bd2);border-radius:11px;width:min(1080px,100%);
            display:flex;flex-direction:column;overflow:hidden}
.modal .win>h3{margin:0;padding:11px 15px;border-bottom:1px solid var(--bd);display:flex;
               align-items:center;gap:10px;font-size:13px;background:var(--panel2);flex-wrap:nowrap}
#modaltitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#modaltools{display:flex;align-items:center;gap:8px;flex:none}
.runname{white-space:nowrap;font-weight:600}
.modal .win>.mbody{flex:1;overflow:auto;padding:15px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--bd);border-radius:7px;padding:2px;gap:2px}
.seg button{background:none;border:0;padding:4px 10px;border-radius:5px;color:var(--tx2);cursor:pointer;font-size:11.5px}
.seg button.on{background:var(--raised);color:var(--tx);box-shadow:inset 0 0 0 1px var(--bd2)}
.pblock{border-radius:7px;padding:8px 11px;margin-bottom:2px;border:1px solid transparent}
.pblock.tools{background:color-mix(in srgb,var(--acc) 8%,transparent);border-color:color-mix(in srgb,var(--acc) 28%,transparent)}
.pblock.icl{background:color-mix(in srgb,var(--alt) 8%,transparent);border-color:color-mix(in srgb,var(--alt) 28%,transparent)}
.pblock.query{background:color-mix(in srgb,var(--ours) 10%,transparent);border-color:color-mix(in srgb,var(--ours) 30%,transparent)}
.pblock .lb{font:10.5px var(--sans);text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);margin-bottom:5px}

/* ---------- misc ---------- */
.empty{padding:60px 24px;text-align:center;color:var(--tx3)}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
      gap:12px;background:var(--bg);z-index:99;color:var(--tx2)}
.spin{width:22px;height:22px;border:2px solid var(--bd2);border-top-color:var(--acc);border-radius:50%;
      animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--bd);border-radius:14px;padding:3px 10px;cursor:pointer;
      color:var(--tx2);font-size:11.5px;user-select:none}
.chip:hover{border-color:var(--bd2);color:var(--tx)}
.chip.on{background:var(--raised);color:var(--tx);border-color:var(--bd2)}
.chip.on.ours{color:var(--ours);border-color:color-mix(in srgb,var(--ours) 45%,transparent)}
.chip.on.base{color:var(--base);border-color:color-mix(in srgb,var(--base) 45%,transparent)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--raised);
       border:1px solid var(--bd2);border-radius:7px;padding:8px 15px;z-index:80;opacity:0;
       transition:opacity .18s;pointer-events:none;font-size:12.3px}
.toast.on{opacity:1}
.hm td{text-align:center;font-family:var(--mono);font-size:11.4px;border:1px solid var(--bd)}
.hm th{text-transform:none;font-size:10.5px;letter-spacing:0;position:static;background:var(--panel2);
       border:1px solid var(--bd);text-align:center}
.hm th.rh{text-align:right;white-space:nowrap}
.linkish{color:var(--acc);cursor:pointer;text-decoration:none;border-bottom:1px dotted currentColor}
</style>
</head>
<body>
<div id="boot"><div class="spin"></div><div id="bootmsg">Loading 1,861 samples × 7 runs…</div></div>
<div id="app" style="visibility:hidden">
<header>
  <div class="brand">NESTFUL Run Explorer <small>1,861 samples · 7 runs · IBM official scorer</small></div>
  <nav id="tabs">
    <button data-v="explorer" class="on">Explorer</button>
    <button data-v="compare">Compare</button>
    <button data-v="overview">Overview</button>
    <button data-v="prompts">Prompts</button>
    <button data-v="about">Method</button>
  </nav>
  <div class="spacer"></div>
  <button class="iconbtn" id="themebtn" title="Toggle theme">◐</button>
</header>
<main>
  <section class="view on" id="v-explorer">
    <div id="explorer">
      <aside id="side">
        <div class="top">
          <div class="searchwrap">
            <input id="q" placeholder="Search query, functions, output, sample id…" spellcheck="false">
            <button class="clr" id="qclr" title="Clear">✕</button>
          </div>
          <div class="frow">
            <label>Domain</label>
            <select id="fdom"><option value="">all</option><option value="math">math (1416)</option><option value="code">code (445)</option></select>
            <label>Calls</label>
            <select id="fcalls"><option value="">any</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5+">5+</option></select>
          </div>
          <div class="frow">
            <label>Focus run</label>
            <select id="ffocus"></select>
          </div>
          <div class="frow">
            <label>Outcome</label>
            <select id="fdiag"><option value="">any</option></select>
          </div>
          <div class="frow">
            <label>vs</label>
            <select id="fvs"></select>
            <select id="fvsdiag"></select>
          </div>
          <div class="frow">
            <label>Relation</label>
            <select id="fvsmode">
              <option value="">no comparison filter</option>
              <option value="focus_only">focus right, other wrong</option>
              <option value="vs_only">other right, focus wrong</option>
              <option value="both">both right</option>
              <option value="neither">both wrong</option>
              <option value="differ">any disagreement</option>
            </select>
            <select id="fvsmetric"><option value="wn">on Win Rate</option><option value="fm">on Full Match</option><option value="ns">on name sequence</option></select>
          </div>
          <div class="frow" style="border-top:1px solid var(--bd);padding-top:8px">
            <label style="width:100%">Runs shown in detail</label>
            <div class="chips" id="runchips"></div>
          </div>
          <div class="count"><span>Showing <b id="nshown">0</b> of 1,861</span><span class="linkish" id="freset">reset filters</span></div>
        </div>
        <div id="list"></div>
      </aside>
      <div id="detail"><div class="empty">Select a sample on the left.</div></div>
    </div>
  </section>
  <section class="view" id="v-compare"><div class="scroll"><div class="pad" id="comparebody"></div></div></section>
  <section class="view" id="v-overview"><div class="scroll"><div class="pad" id="overviewbody"></div></div></section>
  <section class="view" id="v-prompts"><div class="scroll"><div class="pad" id="promptsbody"></div></div></section>
  <section class="view" id="v-about"><div class="scroll"><div class="pad" id="aboutbody"></div></div></section>
</main>
</div>
<div class="modal" id="modal"><div class="win">
  <h3><span id="modaltitle"></span><span id="modaltools"></span>
      <button class="iconbtn" id="modalclose">✕</button></h3>
  <div class="mbody" id="modalbody"></div>
</div></div>
<div class="toast" id="toast"></div>
<script id="payload" type="application/gzip-base64">__PAYLOAD_B64__</script>
<script>
